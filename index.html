<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Article Creator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>News Article Creator</h1>
        <form id="newsForm">
            <label for="topic">Enter a Topic:</label>
            <input type="text" id="topic" placeholder="e.g., Technology, Health, Sports" required>
            <button type="submit">Generate News</button>
        </form>
        <hr>
        <div id="articlesOutput"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
